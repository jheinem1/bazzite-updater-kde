name: Build updater image package
on:
  push:
    tags: ['v*-image.*']
  pull_request:
    paths: ['packaging/image/**', '.github/workflows/release-image.yml', 'tests/test_image_package.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: updater-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packaging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: packaging
          fetch-depth: 0
      - name: Read pinned application source
        id: source
        run: |
          source=$(cat packaging/image/source-commit.txt)
          [[ $source =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$source" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: source
          submodules: recursive
          fetch-depth: 0
      - name: Validate release identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cat ../source/fork-version.txt)
          revision=$(cat packaging/image/revision.txt)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-kde\.[0-9]+$ ]]
          [[ $revision =~ ^[1-9][0-9]*$ ]]
          if [[ "$EVENT_NAME" == push ]]; then
            test "$REF_NAME" = "v${version}-image.${revision}"
          fi
      - name: Free space for the Bazzite builder
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true
      - name: Build, test and package in pinned Bazzite
        run: |
          set -euo pipefail
          builder=$(cat packaging/image/builder-image.txt)
          [[ $builder =~ ^ghcr.io/ublue-os/bazzite@sha256:[0-9a-f]{64}$ ]]
          python3 tests/test_image_package.py -v
          mkdir -p dist
          workspace=$(dirname "$PWD")
          sudo podman run --rm --arch amd64 \
            -v "$workspace:/workspace:rw" -w /workspace/source \
            -e BUILDER_IMAGE="$builder" \
            -e PACKAGE_REVISION="$(cat packaging/image/revision.txt)" \
            -e SOURCE_DIR=/workspace/source -e PACKAGING_COMMIT="$(git rev-parse HEAD)" \
            -e OUTPUT_DIR=/workspace/packaging/dist "$builder" bash -euo pipefail -c '
              mkdir -p /var/lib/alternatives "$HOME"
              test "$(. /etc/os-release; echo "$VERSION_ID")" = "$(cat /workspace/packaging/packaging/image/fedora-version.txt)"
              dnf5 install -y dnf5-plugins gcc-c++ ninja-build git python3
              dnf5 --setopt="disable_excludes=*" builddep -y bazzite-updater.spec
              dnf5 install -y kf6-qqc2-desktop-style kf6-breeze-icons breeze-icon-theme plasma-breeze qt6-qtdeclarative
              git config --global --add safe.directory /workspace/source
              git config --global --add safe.directory /workspace/source/src/components/controllable
              bash /workspace/packaging/packaging/image/build.sh
            '
      - name: Retain release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-image-package
          if-no-files-found: error
          path: |
            packaging/dist/*.tar.xz
            packaging/dist/BUILD-INFO.json
            packaging/dist/SHA256SUMS
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-image-verification
          path: packaging/dist/evidence/
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: updater-image-package
          path: dist
      - name: Publish a new release without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          # gh release create refuses an existing release; never use --clobber.
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "Updater image package $RELEASE_TAG" \
            --notes "Native x86_64 Bazzite image package; Fedora target version is recorded in BUILD-INFO.json. Source, pinned builder and runtime RPM versions are recorded in BUILD-INFO.json. Production UI probe is OFF. Consumers must pin the asset SHA256 and verify startup against their final image. No real update, rollback, rebase or reboot is exercised by release tests." \
            *.tar.xz BUILD-INFO.json SHA256SUMS
